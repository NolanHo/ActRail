name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: actrail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-go-build-

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Go vet
        env:
          PI_HOME: ${{ runner.temp }}/pi-home
        run: |
          sudo mkdir -p /usr/local/go/bin /usr/local/bin
          sudo ln -sf "$(command -v go)" /usr/local/go/bin/go
          sudo ln -sf /bin/true /usr/local/bin/pi
          sudo ln -sf /bin/true /usr/local/bin/codex
          go vet ./...

      - name: Go tests
        env:
          PI_HOME: ${{ runner.temp }}/pi-home
        run: go test -p 1 ./...

      - name: Web typecheck and tests
        working-directory: web
        run: npm test -- --run

      - name: Web build
        working-directory: web
        run: npm run build

      - name: IOD helper build
        run: go build -o data/bin/actrail-iod ./cmd/actrail-iod
