syntax = "proto3";

package actrail.v1;

option go_package = "actrail/proto/actrail/v1;actrailv1";

service SessionCommandService {
  rpc ListSessions(ListSessionsRequest) returns (CommandResponse);
  rpc Send(SendRequest) returns (CommandResponse);
  rpc Enqueue(EnqueueRequest) returns (CommandResponse);
  rpc CancelQueue(CancelQueueRequest) returns (CommandResponse);
  rpc Interrupt(InterruptRequest) returns (CommandResponse);
  rpc RespondUI(RespondUIRequest) returns (CommandResponse);
  rpc SessionState(SessionStateRequest) returns (CommandResponse);
  rpc SessionMessages(SessionMessagesRequest) returns (SessionMessagesResponse);
}

service EventService {
  rpc Subscribe(SubscribeRequest) returns (stream EventEnvelope);
}

message SessionIdentity {
  string session_id = 1;
  string runtime_id = 2;
}

message ListSessionsRequest {
  string group_key = 1;
  int32 offset = 2;
  int32 limit = 3;
  int32 group_offset = 4;
  int32 group_limit = 5;
  string agent_backend = 6;
  string cwd = 7;
  string title = 8;
}

message SendRequest {
  SessionIdentity session = 1;
  string text = 2;
}

message EnqueueRequest {
  SessionIdentity session = 1;
  string text = 2;
}

message CancelQueueRequest {
  SessionIdentity session = 1;
}

message InterruptRequest {
  SessionIdentity session = 1;
}

message RespondUIRequest {
  SessionIdentity session = 1;
  string response_to = 2;
  string value = 3;
}

message SessionStateRequest {
  SessionIdentity session = 1;
}

message CommandResponse {
  bytes payload_json = 1;
  string trace_id = 2;
}

message SubscribeRequest {
  uint64 after_event_id = 1;
}

message EventEnvelope {
  uint64 id = 1;
  string type = 2;
  string stream = 3;
  int64 unix_millis = 4;
  bytes payload_json = 5;
}

message SessionMessagesRequest {
  string session_id = 1;
  optional uint64 after_seq = 2;
  optional uint64 before_seq = 3;
  int32 limit = 4;
  bool init = 5;
  bool deferred = 6;
  uint64 active_turn_start_seq = 7;
  bool include_tool_details = 8;
  string event_id = 9;
  string tool_call_id = 10;
  bool include_tool_events = 11;
}

message SessionMessagesResponse {
  repeated bytes events_json = 1;
  uint64 tail_seq = 2;
  bool has_more = 3;
  optional uint64 next_before_seq = 4;
  string trace_id = 5;
}
